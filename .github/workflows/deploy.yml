name: Build & Deploy

# Builds the static site and deploys it to the web server over SFTP on every
# push to main. Credentials are pulled from GitHub repo Secrets — nothing
# sensitive lives in this file.
on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

# Never let two deploys race each other.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (Astro → dist/)
        run: npm run build

      - name: Deploy dist/ to server via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          local_path: './dist/*'
          remote_path: ${{ secrets.SFTP_REMOTE_PATH }}
          sftp_only: true
          # Set to 'true' once you're confident, to prune files removed from the
          # build. Left false so a deploy never deletes anything unexpectedly.
          delete_remote_files: false
